{% extends "layouts/base.html" %} {% block title %}Delete Ingredient{% endblock %} {%
block content %}
<div class="row justify-content-center">
  <div class="col-md-10 col-md-6">
    <div class="card border-danger shadow-sm">
      <div class="card-header bg-danger text-white">
        <h5 class="mb-0">
          <i class="fa-solid fa-trash"></i> Confirm Delete
        </h5>
      </div>
      <div class="card-body">
        <p class="mt-3">
          Are you sure you want to delete ingredient 
          <strong>{{ ingredient.name }} </strong>?
        </p>

        
        <form
          method="post"
          action="{{ url_for('tbl_ingredient.delete', ingredient_id=ingredient.id) }}"  
        >
            {{ form.hidden_tag() }}

           <button type="submit" class="btn btn-danger">Delete</button>
          
           <a href="{{ url_for('tbl_ingredient.index') }}" class="btn btn-secondary"
            >Cancel</a
          >
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
