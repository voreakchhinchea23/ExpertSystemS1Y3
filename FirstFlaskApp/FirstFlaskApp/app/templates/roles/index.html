{% extends "layouts/base.html" %} {% block title %}Roles{%
endblock %} {% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0"> Roles</h1>
  <a href="{{ url_for('tbl_roles.create') }}" class="btn btn-primary"
    > Create Role</a
  >
  
</div>


<div class="table-responsive">
  <table
    class="table table-striped  table-hover align-middle shadow-sm"
  >
    <thead class="table-light">
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>#Permission</th>
        <th>#Users</th>
        <th class="text-end" style="width: 160px"></th>
      </tr>
    </thead>
    <tbody>
      {% for role in roles %}
      <tr>
        <td>
          <a
            href="{{ url_for('roles.detail', user_id=user.id) }}"
            class="text-decoration-none fw-semibold"
            >{{ role.name }}</a
          >
        </td>
        <td>{{ role.description }}</td>
        <td>{{ role.permission }}</td>
        <td>{{ role.user }}</td>

        <td class="text-end">
          <!--Edit-->
          <a
            href="{{ url_for('tbl_roles.edit', user_id=user.id) }}"
            class="btn btn-sm btn-warning rounded-circle text-light"
            title="Edit"
            ><i class="fa-solid fa-pencil"></i
          ></a>
          <!--Delete (go to custom delete confirmation page)-->
          <a
            href="{{ url_for('roles.delete_confirm', user_id=user.id) }}"
            class="btn btn-sm btn-danger rounded-circle"
            title="Delete"
            ><i class="fa-solid fa-trash"></i
          ></a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>


{% endblock %}
